name: Build and publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ghcr.io/hibenji/roamline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run --detach --name roamline-ci --publish 7863:7863 ghcr.io/hibenji/roamline:latest

      - name: Check HTTP response
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7863/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs roamline-ci
          exit 1

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/hibenji/roamline:latest

      - name: Remove container
        if: always()
        run: docker rm --force roamline-ci
